<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Apply the saved/system theme before first paint (same rule as App.tsx) to avoid a light-to-dark flash.
    try {
      var saved = localStorage.getItem('theme');
      var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>

  <!-- SEO Meta Tags (kept in sync with src/utils/seo.ts; useSEO updates them per page) -->
  <title>CreatorsAI - Connect with AI Spiritual Guides & Deities</title>
  <meta name="description" content="Chat with AI spiritual guides inspired by Krishna, Shiva, Jesus, Ganesha and Buddha for daily wisdom and mindfulness. Free credits to start.">
  <meta name="keywords" content="spiritual chatbot, AI krishna, AI jesus, AI buddha, chat with deities, Gita AI, religious wisdom, mindfulness, spiritual guides, creatorsai">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://creatorsai.techkarmic.com/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CreatorsAI">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="https://creatorsai.techkarmic.com/">

  <meta property="og:description" content="Chat with AI spiritual guides inspired by Krishna, Shiva, Jesus, Ganesha and Buddha for daily wisdom and mindfulness. Free credits to start.">
  <meta property="og:image" content="https://creatorsai.techkarmic.com/og-image.png">
  <meta property="og:image:width" content="1200">

  <meta name="twitter:image" content="https://creatorsai.techkarmic.com/og-image.png">

  <!-- Google Fonts for Premium Typography -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Prevent mobile zoom on input focus */
    @media screen and (max-width: 768px) {

      input,
      textarea,
      select,
      button {
        font-size: 16px !important;
      }
    }
  </style>

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">

  <style>
    /* Simple loader styles */
    #loader {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
      color: #fff;
      font-size: 1.5rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #fff;
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <!-- Meta Pixel Code -->
  <script>
    // Load the pixel after the page has loaded so it never blocks first paint.
    window.addEventListener('load', function () { setTimeout(function () {
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ?
          n.callMethod.apply(n, arguments) : n.queue.push(arguments)
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = []; t = b.createElement(e); t.async = !0;
      t.src = v; s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s)
    }(window, document, 'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '749222448006827');
    fbq('track', 'PageView');
    }, 1500); });
  </script>
</head>


<body>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=749222448006827&ev=PageView&noscript=1" /></noscript>
  <!-- End Meta Pixel Code -->
  <div id="root"><!--app-html-->
    <!-- Loader shown until React takes over (scripts/prerender.mjs replaces this block with the landing page HTML) -->
    <div id="loader">
      <div class="spinner"></div>
    </div>
  <!--/app-html--></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
